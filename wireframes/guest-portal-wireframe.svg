<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1600" width="1440" height="1600" style="background-color: #fbf9f5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
  <!-- Top Ticker -->
  <rect x="0" y="0" width="1440" height="32" fill="#042f2e" />
  <text x="60" y="20" fill="#99f6e4" font-size="11" font-weight="600" letter-spacing="1">UNESCO BIOSPHERE RESERVE &bull; 100% SOLAR POWERED SANCTUARY</text>
  <text x="1100" y="20" fill="#fde68a" font-size="11" font-weight="600">PRIVILEGE CODE: AURA10 (10% OFF)</text>

  <!-- Navbar -->
  <rect x="0" y="32" width="1440" height="80" fill="#ffffff" stroke="#ede4d4" stroke-width="1" />
  <!-- Logo -->
  <rect x="60" y="52" width="40" height="40" rx="10" fill="#042f2e" />
  <text x="115" y="77" fill="#0f172a" font-size="22" font-weight="800" font-family="'Playfair Display', Georgia, serif">AURA</text>

  <!-- Center Tabs -->
  <g transform="translate(480, 52)">
    <rect x="0" y="0" width="480" height="40" rx="20" fill="#f6f2ea" />
    <rect x="4" y="4" width="120" height="32" rx="16" fill="#ffffff" />
    <text x="28" y="24" fill="#0f172a" font-size="11" font-weight="700">Luxury Stays</text>
    <text x="150" y="24" fill="#64748b" font-size="11" font-weight="600">Expeditions</text>
    <text x="260" y="24" fill="#64748b" font-size="11" font-weight="600">Itinerary Planner</text>
    <text x="380" y="24" fill="#64748b" font-size="11" font-weight="600">Dining &amp; Spa</text>
  </g>

  <!-- Right Actions -->
  <g transform="translate(1120, 52)">
    <rect x="0" y="0" width="140" height="40" rx="12" fill="#0f766e" />
    <text x="28" y="24" fill="#ffffff" font-size="11" font-weight="700">My Trips (1)</text>

    <rect x="155" y="0" width="105" height="40" rx="12" fill="#0f172a" />
    <text x="175" y="24" fill="#fcd34d" font-size="11" font-weight="700">PMS Ops</text>
  </g>

  <!-- Hero Section -->
  <rect x="0" y="112" width="1440" height="580" fill="#022c22" />
  <text x="720" y="260" text-anchor="middle" fill="#99f6e4" font-size="12" font-weight="700" letter-spacing="2">WORLD'S LEADING LUXURY SANCTUARIES</text>
  <text x="720" y="330" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="700" font-family="'Playfair Display', Georgia, serif">Where Timeless Hospitality Meets</text>
  <text x="720" y="390" text-anchor="middle" fill="#fde68a" font-size="48" font-weight="700" font-style="italic" font-family="'Playfair Display', Georgia, serif">Boundless Exploration</text>

  <!-- Floating Glass Search Bar -->
  <g transform="translate(240, 470)">
    <rect x="0" y="0" width="960" height="90" rx="24" fill="#ffffff" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.3))" />
    
    <!-- Col 1 -->
    <text x="30" y="35" fill="#0d9488" font-size="10" font-weight="700" letter-spacing="1">DESTINATION</text>
    <text x="30" y="60" fill="#0f172a" font-size="14" font-weight="600">Maldives, Baa Atoll</text>

    <!-- Col 2 -->
    <line x1="250" y1="20" x2="250" y2="70" stroke="#ede4d4" stroke-width="1" />
