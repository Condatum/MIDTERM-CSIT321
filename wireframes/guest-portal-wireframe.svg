    <text x="480" y="200" fill="#ffffff" font-size="18" font-weight="700" font-family="'Playfair Display', Georgia, serif">Palazzo Belvedere Cliffside Manor</text>
    <text x="480" y="260" fill="#64748b" font-size="12">17th-century lemon-grove cliff sanctuary with private funicular.</text>
    <text x="480" y="380" fill="#0f172a" font-size="20" font-weight="700" font-family="'Playfair Display', Georgia, serif">$1,850 <tspan font-size="12" fill="#64748b">/ night</tspan></text>
