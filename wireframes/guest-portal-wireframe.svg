    <text x="760" y="378" fill="#ffffff" font-size="12" font-weight="700">Explore</text>

    <!-- Card 3 -->
    <rect x="910" y="0" width="410" height="420" rx="24" fill="#ffffff" stroke="#ede4d4" stroke-width="1" />
    <rect x="910" y="0" width="410" height="220" rx="24" fill="#334155" />
    <text x="935" y="40" fill="#ffffff" font-size="10" font-weight="800">SWISS ALPS</text>
    <text x="935" y="200" fill="#ffffff" font-size="18" font-weight="700" font-family="'Playfair Display', Georgia, serif">Matterhorn Panorama Glass Chalet</text>
    <text x="935" y="260" fill="#64748b" font-size="12">Tri-level heated glass chalet facing the Matterhorn pyramid.</text>
    <text x="935" y="380" fill="#0f172a" font-size="20" font-weight="700" font-family="'Playfair Display', Georgia, serif">$2,100 <tspan font-size="12" fill="#64748b">/ night</tspan></text>
    <rect x="1180" y="355" width="115" height="38" rx="12" fill="#0f766e" />
    <text x="1215" y="378" fill="#ffffff" font-size="12" font-weight="700">Explore</text>
