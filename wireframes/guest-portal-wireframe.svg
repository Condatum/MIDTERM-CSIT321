  <!-- Footer -->
  <rect x="0" y="1380" width="1440" height="220" fill="#042f2e" />
  <text x="60" y="1450" fill="#ffffff" font-size="24" font-weight="700" font-family="'Playfair Display', Georgia, serif">AURA</text>
  <text x="60" y="1475" fill="#99f6e4" font-size="11" letter-spacing="1">HOSPITALITY &amp; TOURISM SUITE</text>
  <text x="60" y="1515" fill="#cbd5e1" font-size="12">Bespoke architectural retreats, expeditions &amp; full property operations PMS.</text>
  <text x="1000" y="1515" fill="#64748b" font-size="11">&copy; 2026 AURA International. Model-View-Presenter &bull; Blazor &bull; Tailwind.</text>
</svg>
